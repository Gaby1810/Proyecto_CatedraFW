# ==============================================================
# BASE DE DATOS
# ==============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_planilla?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# HIKARICP — pool de conexiones (estabilidad de demo)
# ==============================================================
# Valida la conexión antes de entregarla al pool (evita "connection gone away")
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
# Tiempo máximo esperando una conexión del pool
spring.datasource.hikari.connection-timeout=20000
# Mantiene las conexiones vivas para evitar que MySQL las cierre por inactividad
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================================================
# SERVIDOR
# ==============================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.error.include-message=never

# ==============================================================
# JWT / SEGURIDAD
# ==============================================================
planilla.app.jwtSecret=${JWT_SECRET:SistemaPlanillaUDB2026JWTSecretSeguraConMinimo32Caracteres}
planilla.app.jwtExpirationMs=${JWT_EXPIRATION_MS:28800000}

# ==============================================================
# DEMO / BOOTSTRAP
# ==============================================================
app.bootstrap-demo-data=${APP_BOOTSTRAP_DEMO_DATA:true}
app.demo.admin.username=${APP_ADMIN_USERNAME:admin}
app.demo.admin.password=${APP_ADMIN_PASSWORD:Admin123!}
app.demo.rrhh.username=${APP_RRHH_USERNAME:rrhh}
app.demo.rrhh.password=${APP_RRHH_PASSWORD:Rrhh123!}
app.demo.employee.username=${APP_EMPLOYEE_USERNAME:empleado}
app.demo.employee.password=${APP_EMPLOYEE_PASSWORD:Empleado123!}

# ==============================================================
# SWAGGER / OPENAPI
# ==============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ==============================================================
# MULTIPART
# ==============================================================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
