services:
  mysql:
    image: mysql:8.4
    container_name: sistema-planilla-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_planilla
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sistema_planilla.sql:/docker-entrypoint-initdb.d/01-schema.sql

  backend:
    build:
      context: ./backend
    container_name: sistema-planilla-backend
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sistema_planilla?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_BOOTSTRAP_DEMO_DATA: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: sistema-planilla-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
